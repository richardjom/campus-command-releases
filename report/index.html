<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<title>Report a problem · Campus Command</title>
<!--
  Campus Command phone page: campus teams report a production problem, the
  main TD is alerted in Campus Command, and the troubleshooter's steps show
  up here. Same team code and database rules as Campus Command's chat.
  Published to GitHub Pages by scripts/publish-report-page.sh.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<style>
  :root { --bg:#0a0c0f; --panel:#12151a; --raised:#181c22; --line:#252a32; --text:#e8eaed; --muted:#9aa3ae; --dim:#6f7884; --green:#3dd68c; --red:#f04444; --amber:#f5a524; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 22px; margin: 4px 0 0; }
  h2 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; min-height: 48px; padding: 10px 12px; width: 100%; }
  textarea { min-height: 110px; resize: vertical; }
  button { font: inherit; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); color: var(--text); padding: 0 16px; cursor: pointer; }
  button.primary { background: #c62828; border-color: #c62828; color: #fff; font-weight: 700; }
  button.go { background: #1f7a4d; border-color: #1f7a4d; color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .error { color: #ff8a8a; font-size: 14px; }
  .status { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: #c62828; color: #fff; }
  .status.acknowledged { background: #8a5a0c; } .status.resolved { background: #1f5a3d; }
  ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  li { border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  li label { flex-direction: row; gap: 12px; align-items: flex-start; color: var(--text); font-size: 16px; }
  li input { width: 24px; height: 24px; min-height: 0; flex: none; margin-top: 2px; accent-color: var(--green); }
  li.done { opacity: .55; } li.done b { text-decoration: line-through; }
  .detail { display: block; color: var(--muted); font-size: 14px; margin-top: 3px; }
  .source { display: block; color: var(--dim); font-size: 12px; margin-top: 3px; }
  .warn { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; background: #c62828; border-radius: 5px; padding: 1px 6px; margin-left: 6px; }
  .escalate { color: #f5c46b; margin: 0; }
  .mine button { text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 60px; }
  .hidden { display: none !important; }
  a { color: #8fb4ff; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Report a production problem</h1>
    <span class="muted" id="who"></span>
  </div>

  <!-- Join once on this phone -->
  <section class="card hidden" id="join">
    <h2>First time on this phone</h2>
    <span class="muted">Enter your name, your campus and the team code from your production director. You only do this once.</span>
    <label>Your name<input id="j-name" autocomplete="name" maxlength="60"></label>
    <label>Campus<select id="j-campus"></select></label>
    <label>Team code<input id="j-code" autocomplete="off" autocapitalize="characters"></label>
    <button class="go" id="j-go">Join</button>
    <span class="error" id="j-err"></span>
  </section>

  <!-- Report form -->
  <form class="card hidden" id="report">
    <div class="row">
      <label>Campus<select id="r-campus"></select></label>
      <label>When<select id="r-when">
        <option value="now">Happening now</option>
        <option value="soon">Before next service</option>
        <option value="fyi">For later</option>
      </select></label>
    </div>
    <label>Area<select id="r-area">
      <option value="audio">Audio</option>
      <option value="video">Video / cameras</option>
      <option value="stream">Livestream</option>
      <option value="propresenter">ProPresenter / screens</option>
      <option value="lighting">Lighting</option>
      <option value="network">Network / internet</option>
      <option value="other">Something else</option>
    </select></label>
    <label>What's wrong?<input id="r-title" maxlength="200" placeholder="e.g. No audio on the livestream"></label>
    <label>Details (what you see, what you've tried, error messages)<textarea id="r-details" maxlength="4000"></textarea></label>
    <button class="primary" id="r-go" type="submit">Report and alert the TD</button>
    <span class="error" id="r-err"></span>
  </form>

  <!-- One issue, live -->
  <section class="card hidden" id="issue">
    <span class="status" id="i-status"></span>
    <h2 id="i-title"></h2>
    <span class="muted" id="i-meta"></span>
    <div id="i-steps"></div>
    <label>Add a note<input id="i-note" maxlength="4000" placeholder="What you tried, what happened"></label>
    <div class="row">
      <button id="i-note-go">Add note</button>
      <button class="go" id="i-resolve">It's fixed</button>
    </div>
    <span class="error" id="i-err"></span>
    <button id="i-back">Report something else</button>
  </section>

  <section class="card mine hidden" id="mine">
    <h2>Open issues at your campus</h2>
    <div id="mine-list" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
</main>

<script>
// The Campus Command chat server: public address and publishable key (safe to
// ship; the database only lets people who joined with the team code in).
const SUPABASE_URL = 'https://nuhvcawmqhsomdruiufj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-SxRlA42EuJcSkESTDvnCw_DRQzoYvr';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, storageKey: 'campus-command.report' } });
const $ = (id) => document.getElementById(id);
const show = (id, on = true) => $(id).classList.toggle('hidden', !on);
const msg = (e) => (e && e.message) || String(e);
let me = null, current = null, sub = null;

async function campuses() {
  const { data } = await sb.rpc('list_campuses');
  return data || [];
}
function fill(select, list, pick) {
  select.innerHTML = '';
  for (const c of list) { const o = document.createElement('option'); o.textContent = c; select.appendChild(o); }
  if (pick) select.value = pick;
}

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const { data } = await sb.from('campus_members').select('name, campus').eq('user_id', session.user.id).maybeSingle();
    me = data;
  }
  const list = await campuses();
  if (!me) {
    fill($('j-campus'), list);
    show('join');
    return;
  }
  $('who').textContent = `${me.name} · ${me.campus}`;
  fill($('r-campus'), list, me.campus);
  show('join', false);
  show('report');
  const open = new URLSearchParams(location.search).get('issue');
  if (open) openIssue(Number(open));
  loadMine();
}

$('j-go').onclick = async () => {
  $('j-err').textContent = '';
  $('j-go').disabled = true;
  try {
    let { data: { session } } = await sb.auth.getSession();
    if (!session) { const r = await sb.auth.signInAnonymously(); if (r.error) throw r.error; }
    const r = await sb.rpc('join_team', { p_code: $('j-code').value.trim().toUpperCase(), p_name: $('j-name').value.trim(), p_campus: $('j-campus').value });
    if (r.error) throw r.error;
    await start();
  } catch (e) { $('j-err').textContent = msg(e); }
  $('j-go').disabled = false;
};

$('report').onsubmit = async (e) => {
  e.preventDefault();
  $('r-err').textContent = '';
  const title = $('r-title').value.trim();
  if (title.length < 3) { $('r-err').textContent = 'Say what’s wrong in a few words.'; return; }
  $('r-go').disabled = true;
  try {
    const { data, error } = await sb.from('issues').insert({ campus: $('r-campus').value, area: $('r-area').value, urgency: $('r-when').value, title, details: $('r-details').value.trim() }).select().single();
    if (error) throw error;
    sb.functions.invoke('troubleshoot', { body: { issue_id: data.id } });
    $('r-title').value = ''; $('r-details').value = '';
    openIssue(data.id);
  } catch (err) { $('r-err').textContent = msg(err); }
  $('r-go').disabled = false;
};

async function openIssue(id) {
  const { data } = await sb.from('issues').select('*').eq('id', id).single();
  if (!data) return;
  current = data;
  render();
  show('report', false); show('mine', false); show('issue');
  history.replaceState(null, '', `?issue=${id}`);
  if (sub) sb.removeChannel(sub);
  sub = sb.channel('issue-' + id)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'issues', filter: `id=eq.${id}` }, (p) => { current = p.new; render(); })
    .subscribe();
}

function render() {
  const i = current;
  $('i-status').textContent = i.status === 'open' ? 'Sent to the TD' : i.status === 'acknowledged' ? `${i.acknowledged_by} is on it` : 'Resolved';
  $('i-status').className = 'status ' + i.status;
  $('i-title').textContent = i.title;
  $('i-meta').textContent = `${i.campus} · reported by ${i.reporter_name} at ${new Date(i.created_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
  const box = $('i-steps');
  box.innerHTML = '';
  if (i.ai_status === 'pending' || i.ai_status === 'working') {
    box.innerHTML = '<span class="muted">Looking through the SOPs and the web for steps to try… about a minute.</span>';
  } else if (i.ai_status === 'failed') {
    box.innerHTML = `<span class="error"></span>`;
    box.firstChild.textContent = i.ai_error || 'No steps this time. The TD has been alerted.';
  } else if (i.ai_steps) {
    const p = i.ai_steps;
    const sum = document.createElement('p'); sum.style.margin = '0'; sum.textContent = p.summary; box.appendChild(sum);
    const ol = document.createElement('ol');
    p.steps.forEach((s, n) => {
      const num = n + 1, done = (i.steps_done || []).includes(num);
      const li = document.createElement('li'); if (done) li.className = 'done';
      const lab = document.createElement('label');
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = done; cb.disabled = i.status === 'resolved';
      cb.onchange = () => sb.rpc('issue_action', { p_issue: i.id, p_action: 'step', p_body: s.action, p_step: num });
      const text = document.createElement('span');
      const b = document.createElement('b'); b.textContent = `${num}. ${s.action}`; text.appendChild(b);
      if (s.visible_to_audience) { const w = document.createElement('span'); w.className = 'warn'; w.textContent = 'AUDIENCE WILL NOTICE'; text.appendChild(w); }
      if (s.detail) { const d = document.createElement('span'); d.className = 'detail'; d.textContent = s.detail; text.appendChild(d); }
      const src = (i.ai_sources || []).find((x) => x.id === s.source);
      const so = document.createElement('span'); so.className = 'source';
      if (s.source.startsWith('http')) { const a = document.createElement('a'); a.href = s.source; a.target = '_blank'; a.rel = 'noreferrer'; a.textContent = src ? src.title : s.source; so.appendChild(a); }
      else so.textContent = src ? src.title : s.source === 'general' ? 'General know-how' : s.source;
      text.appendChild(so);
      lab.append(cb, text); li.appendChild(lab); ol.appendChild(li);
    });
    box.appendChild(ol);
    if (p.escalate_when) { const e = document.createElement('p'); e.className = 'escalate'; e.textContent = 'Escalate: ' + p.escalate_when; box.appendChild(e); }
  }
  $('i-resolve').disabled = i.status === 'resolved';
}

$('i-note-go').onclick = async () => {
  const note = $('i-note').value.trim(); if (!note) return;
  const r = await sb.rpc('issue_action', { p_issue: current.id, p_action: 'note', p_body: note, p_step: null });
  if (r.error) $('i-err').textContent = msg(r.error); else $('i-note').value = '';
};
$('i-resolve').onclick = async () => {
  const r = await sb.rpc('issue_action', { p_issue: current.id, p_action: 'resolve', p_body: $('i-note').value.trim(), p_step: null });
  if (r.error) $('i-err').textContent = msg(r.error); else $('i-note').value = '';
};
$('i-back').onclick = () => {
  if (sub) sb.removeChannel(sub);
  current = null;
  history.replaceState(null, '', location.pathname);
  show('issue', false); show('report'); loadMine();
};

async function loadMine() {
  const { data } = await sb.from('issues').select('id, title, status, created_at').eq('campus', me.campus).neq('status', 'resolved').order('created_at', { ascending: false }).limit(10);
  const list = $('mine-list'); list.innerHTML = '';
  for (const i of data || []) {
    const b = document.createElement('button');
    const t = document.createElement('b'); t.textContent = i.title;
    const m = document.createElement('span'); m.className = 'muted'; m.style.fontSize = '13px';
    m.textContent = `${i.status === 'open' ? 'Waiting for the TD' : 'Being worked on'} · ${new Date(i.created_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
    b.append(t, m); b.onclick = () => openIssue(i.id); list.appendChild(b);
  }
  show('mine', !!(data && data.length));
}

start();
</script>
</body>
</html>
